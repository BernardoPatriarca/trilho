name: trilho
description: "Trilho: agenda, calendário e tarefas em um só lugar, 100% offline."
publish_to: 'none'

# versionName+versionCode do APK. Suba os dois a cada APK novo.
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Flutter 3.50 separou o Material neste pacote (flutter/material.dart está obsoleto).
  material_ui: ^1.1.0

  # Estado e navegação
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Banco local (SQLite)
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6

  # Notificações e fuso horário
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Calendário (mês) e gráficos
  table_calendar: ^3.3.0
  fl_chart: ^1.3.1

  # Backup e exportação
  file_picker: ^13.4.0
  share_plus: ^13.3.1

  # Datas e PIN opcional (hash SHA-256 com salt no armazenamento seguro)
  intl: ^0.20.3
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # SQLite em memória nos testes de repositório.
  sqflite_common_ffi: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/branding/icon.png

  # Fontes empacotadas: o app não tem internet (sem google_fonts em runtime).
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Regular.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Medium.ttf
          weight: 500
        - asset: assets/fonts/Oswald-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700

# Ícone do app (gerado com: dart run flutter_launcher_icons).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  min_sdk_android: 26
  adaptive_icon_background: "#12161C"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  adaptive_icon_monochrome: assets/branding/icon_monochrome.png

# Splash nativo (gerado com: dart run flutter_native_splash:create).
flutter_native_splash:
  color: "#12161C"
  image: assets/branding/splash.png
  android_12:
    color: "#12161C"
    image: assets/branding/splash_android12.png
    icon_background_color: "#12161C"
  ios: false
  web: false
